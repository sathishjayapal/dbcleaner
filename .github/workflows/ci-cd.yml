name: CI/CD → Docker Hub

# Builds dbcleaner (Spring Boot app + webpack frontend, all inside the
# multi-stage Dockerfile) and pushes a fresh :latest image to Docker Hub on
# every push to the default branch. Watchtower running in the VirtualBox /
# Portainer VM polls Docker Hub every 5 min and redeploys automatically.

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'mvnw'
      - '.mvn/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'webpack.config.js'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Docker Hub namespace is public (not a secret). Hardcoding it means the image
  # tag can never resolve to "/dbcleaner" if a secret is missing/not passed
  # (e.g. on pull_request events). Only the token below stays a secret.
  IMAGE_NAME: travelhelper0h/dbcleaner

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only (no push): validates the image builds and warms the cache.
      # amd64 only here; the published image adds arm64 in the publish job.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Trivy scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build locally for scanning — shares the gha cache with the build job.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (CRITICAL severity only)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trivy vulnerability report (all severities for transparency)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            --format table \
            --ignore-unfixed \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} || true

  publish:
    name: Build & push image
    needs: [ build, scan ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: travelhelper0h
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Multi-arch push — only reached when build and scan both succeeded.
      # The VirtualBox VM is linux/amd64, but this image is also deployed to
      # arm64 Portainer hosts (Apple Silicon).
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write summary
        run: |
          echo "## Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${{ env.IMAGE_NAME }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA tag**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Watchtower** will auto-redeploy in ≤ 5 min" >> "$GITHUB_STEP_SUMMARY"
